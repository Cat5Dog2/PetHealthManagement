version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      # リポジトリ直下には CPM の Directory.Packages.props がある。"/" が無いと探索対象外になる。
      # ローカルツールマニフェストは必ず .config/dotnet-tools.json に置く。Dependabot は
      # このパスしか探さず、直下の dotnet-tools.json は "/" を足しても読まない
      # （直下に置いていた間、dotnet-ef は一度も更新 PR に含まれなかった）。
      - "/"
      - "/src/**"
      - "/tests/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    target-branch: "main"
    # 枠が埋まると更新 PR の作成が次回以降に先送りされ、しかもそれが通知されない。
    # 実際 EFCore.SqlServer 等の 10.0.10 は長期間 PR 化されていなかった。
    open-pull-requests-limit: 10
    # 公開直後の版は 7 日寝かせてから PR にする（取り下げられる版や、乗っ取られた版を避ける）。
    # 既定の 3 日には頼らない。SkiaSharp 4.154.0 は公開から 2.5 時間で PR になった（#180）。
    # .NET の 10.0.x トレインだけは待たせない。毎月のセキュリティ修正であり、このリポジトリは
    # Dependabot security updates が無効なので、脆弱性の修正もこの版更新でしか届かない。
    cooldown:
      default-days: 7
      exclude:
        - "Microsoft.AspNetCore.*"
        - "Microsoft.EntityFrameworkCore.*"
        - "dotnet-ef"
        - "System.Security.Cryptography.Pkcs"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # ASP.NET Core と EF Core は同一トレイン（10.0.x）で同時にリリースされる。
      # PR が分かれると片方だけマージされてバージョンが割れるため 1 本にまとめる。
      # dotnet-ef と、脆弱性対策で直接参照している Pkcs も同じトレインなので同居させる。
      aspnetcore-efcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "dotnet-ef"
          - "System.Security.Cryptography.Pkcs"
        update-types:
          - "minor"
          - "patch"
      # テスト基盤。src と tests で版がずれると原因の切り分けが難しくなる。
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Playwright.*"
          - "xunit*"
          - "coverlet.*"
        update-types:
          - "minor"
          - "patch"
      azure:
        patterns:
          - "Azure.*"
        update-types:
          - "minor"
          - "patch"
      # SkiaSharp 本体と NativeAssets は版が一致しないと実行時に失敗する。
      # 片方だけの PR が出ないよう、major も含めて必ず 1 本にまとめる（update-types で絞らない）。
      skiasharp:
        patterns:
          - "SkiaSharp*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    target-branch: "main"
    # あえてグループ化しない。同じ action を使う複数ワークフローは Dependabot が
    # 元から 1 PR にまとめる（#130 は setup-dotnet を 5 ファイルまとめて更新した）。
    # ここでグループを足すと、別々の action の major 更新まで同じ PR に同居し、
    # CI が落ちたときの切り分けが難しくなる。
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "10:00"
      timezone: "Asia/Tokyo"
    target-branch: "main"
    open-pull-requests-limit: 1
    # cooldown は付けない。SDK の更新は毎月のセキュリティ修正なので、nuget の .NET トレインと同じく待たせない。
    commit-message:
      prefix: "deps"
      include: "scope"
